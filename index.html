<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คราคาและสุขภาพหุ้น</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        button { padding: 10px 20px; background-color: #00B900; color: white; border: none; border-radius: 5px; width: 100%; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>รายงานราคา & สุขภาพหุ้น</h2>
        
        <div class="form-group">
            <label><input type="radio" name="assetType" value="gold" checked onclick="toggleInput()"> ราคาทองคำ</label><br>
            <label><input type="radio" name="assetType" value="stock" onclick="toggleInput()"> ราคาหุ้นรายตัว</label><br>
            <label><input type="radio" name="assetType" value="portfolio" onclick="toggleInput()"> เช็คหุ้นทั้งพอร์ต</label><br>
            <label><input type="radio" name="assetType" value="health" onclick="toggleInput()"> 🏥 เช็คสุขภาพหุ้น (ปันผล/งบ)</label> 
        </div>

        <div class="form-group" id="stockInputGroup" style="display: none;">
            <label for="stockName">ชื่อหุ้น:</label>
            <input type="text" id="stockName" list="stockList" placeholder="เช่น TISCO, SCB, NEO" style="width: 100%; padding: 8px; text-transform: uppercase;">
            <datalist id="stockList">
                <option value="TISCO"></option>
                <option value="SCB"></option>
                <option value="BAM"></option>
                <option value="NEO"></option>
                <option value="AP"></option>
            </datalist>
        </div>

        <button onclick="sendFlexMessage()">ส่งข้อความเข้าแชท</button>
    </div>

    <script>
        const LIFF_ID = "2011085564-YWiDl1zG"; 
        const myPortfolio = ["SCB", "TISCO", "BAM", "AP"];

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            } catch (err) {
                console.error("LIFF Initialization failed", err);
            }
        }

        function toggleInput() {
            const type = document.querySelector('input[name="assetType"]:checked').value;
            document.getElementById('stockInputGroup').style.display = (type === 'stock' || type === 'health') ? 'block' : 'none';
        }

        // 1. ดึงราคาหุ้นแบบย่อ
        async function fetchPriceData(type, name) {
            if (type === 'gold') {
                try {
                    const response = await fetch('https://api.chnwt.dev/thai-gold-api/latest');
                    const data = await response.json();
                    
                    const goldBuy = data.response.price.gold_bar.buy;
                    const goldSell = data.response.price.gold_bar.sell;
                    const apiTime = data.response.update_time.replace('เวลา', '').trim();
                    const currentDate = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
                    
                    return { 
                        title: "ราคาทองคำแท่ง", headerBgColor: "#FFB000", headerFontColor: "#FFFFFF", 
                        items: [
                            { label: "ขายออก :", value: goldSell, color: "#333333", size: "xxl" },
                            { label: "รับซื้อ :", value: goldBuy, color: "#333333", size: "xxl" }
                        ],
                        footer: `อัปเดต : ${currentDate} เวลา ${apiTime}`
                    };
                } catch (error) {
                    return { title: "ราคาทองคำแท่ง", headerBgColor: "#FF334B", headerFontColor: "#FFFFFF", items: [{ label: "สถานะ :", value: "ดึงข้อมูลล้มเหลว", color: "#FF334B", size: "md" }], footer: "-" };
                }
            } else {
                try {
                    const symbol = name.toUpperCase() + '.BK';
                    const targetUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${symbol}`;
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                    
                    const response = await fetch(proxyUrl);
                    const data = await response.json();
                    
                    if (data.chart && data.chart.error) throw new Error("ไม่พบข้อมูลหุ้น");
                    
                    const meta = data.chart.result[0].meta;
                    const currentPrice = meta.regularMarketPrice;
                    const previousClose = meta.chartPreviousClose;
                    
                    const change = currentPrice - previousClose;
                    const percentChange = (change / previousClose) * 100;
                    
                    const sign = change > 0 ? "+" : (change < 0 ? "-" : "");
                    const changeText = sign + Math.abs(change).toFixed(2);
                    const percentText = sign + Math.abs(percentChange).toFixed(2) + "%";
                    const color = change > 0 ? "#1DB446" : (change < 0 ? "#FF334B" : "#999999");
                    
                    return { 
                        title: `ราคาหุ้น ${name.toUpperCase()}`, headerBgColor: "#1DB446", headerFontColor: "#FFFFFF", 
                        items: [
                            { label: "ราคาล่าสุด :", value: `${currentPrice.toFixed(2)} ฿`, color: "#333333", size: "xxl" },
                            { label: "เปลี่ยนแปลง :", value: changeText, color: color, size: "md" },
                            { label: "คิดเป็น :", value: percentText, color: color, size: "md" }
                        ],
                        footer: "-"
                    };
                } catch (error) {
                    return { title: `ไม่พบหุ้น ${name.toUpperCase()}`, headerBgColor: "#FF334B", headerFontColor: "#FFFFFF", items: [{ label: "สถานะ :", value: "ดึงข้อมูลล้มเหลว", color: "#FF334B", size: "xs" }], footer: "-" };
                }
            }
        }

        // 2. ดึงข้อมูลสุขภาพหุ้น (แก้ปัญหา Yahoo บล็อก โดยใช้ v7 API แทน)
        async function fetchStockHealth(name) {
            try {
                const symbol = name.toUpperCase() + '.BK';
                // เปลี่ยนมาใช้ v7/quote ซึ่งเสถียรและไม่ค่อยโดนบล็อกเหมือน v10
                const targetUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                const data = await response.json();

                // เช็คว่ามีข้อมูลส่งกลับมาหรือไม่
                if (!data.quoteResponse || !data.quoteResponse.result || data.quoteResponse.result.length === 0) {
                    throw new Error("ไม่มีข้อมูลงบการเงินบนระบบ");
                }

                const result = data.quoteResponse.result[0];

                const price = result.regularMarketPrice || 0;
                
                // คำนวณค่าต่างๆ จากข้อมูล v7
                const yieldVal = result.trailingAnnualDividendYield ? (result.trailingAnnualDividendYield * 100).toFixed(2) + "%" : "N/A";
                const divRate = result.trailingAnnualDividendRate ? `${result.trailingAnnualDividendRate.toFixed(2)} ฿` : "N/A";
                
                let xdDateText = "N/A";
                if (result.dividendDate) {
                    xdDateText = new Date(result.dividendDate * 1000).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
                }

                const pe = result.trailingPE ? result.trailingPE.toFixed(2) : "N/A";
                const pbv = result.priceToBook ? result.priceToBook.toFixed(2) : "N/A";
                const eps = result.epsTrailingTwelveMonths ? `${result.epsTrailingTwelveMonths.toFixed(2)} ฿` : "N/A";
                
                const high52 = result.fiftyTwoWeekHigh ? result.fiftyTwoWeekHigh.toFixed(2) : "N/A";
                const low52 = result.fiftyTwoWeekLow ? result.fiftyTwoWeekLow.toFixed(2) : "N/A";

                // การ์ดใบที่ 1: Valuation & งบการเงิน
                const card1 = {
                    title: `Valuation (${name.toUpperCase()})`,
                    headerBgColor: "#5E35B1",
                    headerFontColor: "#FFFFFF",
                    items: [
                        { label: "ราคาปัจจุบัน :", value: `${price.toFixed(2)} ฿`, color: "#333333", size: "xl" },
                        { label: "P/E Ratio :", value: pe, color: "#1DB446", size: "xl" },
                        { label: "P/BV Ratio :", value: pbv, color: "#666666", size: "md" },
                        { label: "กำไร/หุ้น (EPS) :", value: eps, color: "#666666", size: "md" }
                    ],
                    footer: "ประเมินความถูกแพงและกำไรของธุรกิจ"
                };

                // การ์ดใบที่ 2: ข้อมูลปันผล & สถิติ
                const card2 = {
                    title: `ปันผล & สถิติ (${name.toUpperCase()})`,
                    headerBgColor: "#0288D1",
                    headerFontColor: "#FFFFFF",
                    items: [
                        { label: "% ปันผล (Yield) :", value: yieldVal, color: "#1DB446", size: "xl" },
                        { label: "ปันผลสะสม/ปี :", value: divRate, color: "#333333", size: "md" },
                        { label: "วันจ่ายปันผล :", value: xdDateText, color: "#666666", size: "md" },
                        { label: "กรอบราคา 52w :", value: `${low52} - ${high52}`, color: "#666666", size: "xs" }
                    ],
                    footer: "ข้อมูลอ้างอิงจาก Yahoo Finance"
                };

                return [card1, card2];

            } catch (error) {
                return [{ 
                    title: `ไม่พบข้อมูล ${name.toUpperCase()}`, 
                    headerBgColor: "#FF334B", 
                    headerFontColor: "#FFFFFF", 
                    items: [{ label: "สถานะ :", value: "ดึงข้อมูลสถิติล้มเหลว", color: "#FF334B", size: "xs" }], 
                    footer: "-" 
                }];
            }
        }

        function createFlexBubble(data) {
            const bodyContents = data.items.map(item => ({
                type: "box", layout: "horizontal", margin: "md",
                contents: [
                    { type: "text", text: item.label, size: item.size === "xxl" ? "xl" : item.size, color: "#666666", flex: 5, gravity: "center" },
                    { type: "text", text: item.value, size: item.size, weight: "bold", color: item.color, align: "end", flex: 5, adjustMode: "shrink-to-fit", gravity: "center" }
                ]
            }));

            if (data.footer && data.footer !== "-") {
                bodyContents.push({ type: "text", text: data.footer, size: "xs", color: "#999999", margin: "xl", wrap: true });
            }

            return {
                type: "bubble", size: "mega",
                header: { type: "box", layout: "vertical", backgroundColor: data.headerBgColor, paddingAll: "lg", contents: [{ type: "text", text: data.title, weight: "bold", size: "lg", color: data.headerFontColor }] },
                body: { type: "box", layout: "vertical", contents: bodyContents }
            };
        }

        async function sendFlexMessage() {
            const type = document.querySelector('input[name="assetType"]:checked').value;
            const stockName = document.getElementById('stockName').value;

            let flexJson = { type: "flex", altText: "รายงานราคา", contents: {} };

            if (type === 'gold' || type === 'stock') {
                if (type === 'stock' && !stockName) { alert("กรุณาใส่ชื่อหุ้น"); return; }
                const data = await fetchPriceData(type, stockName);
                flexJson.altText = `รายงาน${data.title}`;
                flexJson.contents = createFlexBubble(data);

            } else if (type === 'portfolio') {
                flexJson.altText = "รายงานราคาพอร์ตลงทุน";
                const promises = myPortfolio.map(symbol => fetchPriceData('stock', symbol));
                const results = await Promise.all(promises);
                flexJson.contents = { type: "carousel", contents: results.map(data => createFlexBubble(data)) };

            } else if (type === 'health') {
                if (!stockName) { alert("กรุณาใส่ชื่อหุ้นที่ต้องการเช็คสุขภาพ"); return; }
                flexJson.altText = `รายงานสุขภาพหุ้น ${stockName.toUpperCase()}`;
                
                const cardsData = await fetchStockHealth(stockName);
                if (!cardsData) return;
                
                flexJson.contents = {
                    type: "carousel",
                    contents: cardsData.map(data => createFlexBubble(data))
                };
            }

            try {
                if (liff.isInClient()) {
                    await liff.sendMessages([flexJson]);
                    liff.closeWindow(); 
                } else {
                    alert("ฟังก์ชันนี้ต้องเปิดผ่านแอป LINE เท่านั้น");
                }
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการส่งข้อความ กรุณาลองใหม่");
            }
        }

        initializeLiff();
    </script>
</body>
</html>
