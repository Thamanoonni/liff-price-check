<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คราคา</title>
    <!-- นำเข้า LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        button { padding: 10px 20px; background-color: #00B900; color: white; border: none; border-radius: 5px; width: 100%; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>รายงานราคา</h2>
        
        <div class="form-group">
            <label><input type="radio" name="assetType" value="gold" checked onclick="toggleInput()"> ราคาทองคำ</label><br>
            <label><input type="radio" name="assetType" value="stock" onclick="toggleInput()"> ราคาหุ้น</label>
        </div>

        <div class="form-group" id="stockInputGroup" style="display: none;">
            <label for="stockName">ชื่อหุ้น:</label>
            <input type="text" id="stockName" list="stockList" placeholder="เช่น TISCO, SCB, BAM" style="width: 100%; padding: 8px; text-transform: uppercase;">
            <datalist id="stockList">
                <option value="TISCO"></option>
                <option value="SCB"></option>
                <option value="BAM"></option>
                <option value="NEO"></option>
                <option value="AP"></option>
            </datalist>
        </div>

        <button onclick="sendFlexMessage()">ส่งข้อความเข้าแชท</button>
    </div>

    <script>
        // LIFF ID ของคุณ
        const LIFF_ID = "2011085564-YWiDl1zG"; 

        // เริ่มต้นการทำงานของ LIFF
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            } catch (err) {
                console.error("LIFF Initialization failed", err);
            }
        }

        // ซ่อน/แสดง ช่องใส่ชื่อหุ้น
        function toggleInput() {
            const isStock = document.querySelector('input[name="assetType"]:checked').value === 'stock';
            document.getElementById('stockInputGroup').style.display = isStock ? 'block' : 'none';
        }

        // ฟังก์ชันดึงข้อมูลราคาของจริงผ่าน API
        async function fetchPriceData(type, name) {
            if (type === 'gold') {
                try {
                    const response = await fetch('https://api.chnwt.dev/thai-gold-api/latest');
                    const data = await response.json();
                    
                    const goldBuy = data.response.price.gold_bar.buy;
                    const goldSell = data.response.price.gold_bar.sell;
                    const apiTime = data.response.update_time.replace('เวลา', '').trim(); // ลบคำว่า "เวลา" ที่ติดมาจาก API
                    
                    const currentDate = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
                    
                    // ส่งข้อมูลแบบโครงสร้างใหม่ เพื่อนำไปจัด Alignment แนวนอน
                    return { 
                        title: "ราคาทองคำแท่ง", 
                        headerBgColor: "#FFB000", // พื้นหลังสีทอง
                        headerFontColor: "#FFFFFF", // ตัวหนังสือสีขาว
                        items: [
                            { label: "ขายออก :", value: goldSell, color: "#333333", size: "xxl" },
                            { label: "รับซื้อ :", value: goldBuy, color: "#333333", size: "xxl" }
                        ],
                        footer: `อัปเดต : ${currentDate} เวลา ${apiTime}`
                    };
                } catch (error) {
                    console.error("Gold API Error:", error);
                    return { title: "ราคาทองคำแท่ง", headerBgColor: "#FF334B", headerFontColor: "#FFFFFF", items: [{ label: "สถานะ :", value: "ไม่สามารถดึงข้อมูลได้", color: "#FF334B", size: "xl" }], footer: "-" };
                }
            } else {
                // ดึงราคาหุ้นไทยด้วยการแกะข้อมูลจาก Google Finance (Web Scraping)
                try {
                    const symbol = name.toUpperCase();
                    // กำหนดตลาด BKK (ตลาดหลักทรัพย์แห่งประเทศไทย) ให้กับ Google Finance
                    const url = `https://www.google.com/finance/quote/${symbol}:BKK?hl=th`;
                    // ใช้ Proxy แบบ GET เพื่อดึง HTML กลับมา
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                    
                    const response = await fetch(proxyUrl);
                    const proxyData = await response.json();
                    const htmlText = proxyData.contents; 
                    
                    // 1. ค้นหาราคาล่าสุด จากคลาส YMlKec fxKbKc (คลาสมาตรฐานของหน้า Google Finance)
                    const priceMatch = htmlText.match(/class="YMlKec fxKbKc"[^>]*>(.*?)<\/div>/);
                    if (!priceMatch) throw new Error("ไม่พบตัวเลขราคาหุ้น (โครงสร้างเว็บอาจเปลี่ยนแปลง)");
                    
                    // ตัดเครื่องหมาย ฿ หรือ , ออกให้เหลือแต่ตัวเลข
                    const currentPrice = parseFloat(priceMatch[1].replace(/[^\d.]/g, ''));
                    
                    // 2. ค้นหาส่วนต่างราคา และเปอร์เซ็นต์ (ซ่อนอยู่ในคลาส JwB6zf)
                    // เราจะดึงข้อมูลที่อยู่ในคลาส JwB6zf ทั้งหมดออกมา
                    const changeMatches = [...htmlText.matchAll(/class="JwB6zf"[^>]*>(.*?)<\/div>/g)];
                    
                    let changeText = "0.00";
                    let percentText = "0.00%";
                    let sign = "";
                    let color = "#999999";

                    if (changeMatches.length >= 2) {
                        // Match ตัวแรกคือส่วนต่างราคา, ตัวที่สองคือเปอร์เซ็นต์ (มักจะมีวงเล็บครอบ)
                        const rawChange = changeMatches[0][1].replace(/[^\d.]/g, '');
                        const rawPercent = changeMatches[1][1].replace(/[^\d.]/g, '');
                        
                        // ตรวจสอบแนวโน้มราคาขึ้นหรือลง จากชื่อคลาสในกล่องของ Google Finance
                        if (htmlText.includes('class="P2Luy Ez2Ioe"')) { 
                            // คลาสติดลบ (แดง)
                            sign = "-";
                            color = "#FF334B";
                        } else if (htmlText.includes('class="P2Luy"')) {
                            // คลาสบวก (เขียว)
                            sign = "+";
                            color = "#1DB446";
                        }

                        changeText = `${sign}${rawChange}`;
                        percentText = `${sign}${rawPercent}%`;
                    }

                    return { 
                        title: `ราคาหุ้น ${symbol}`, 
                        headerBgColor: "#1DB446", 
                        headerFontColor: "#FFFFFF", 
                        items: [
                            { label: "ราคาล่าสุด :", value: `${currentPrice.toFixed(2)} ฿`, color: "#333333", size: "xxl" },
                            { label: "เปลี่ยนแปลง :", value: changeText, color: color, size: "md" },
                            { label: "คิดเป็น :", value: percentText, color: color, size: "md" }
                        ],
                        footer: "-"
                    };
                } catch (error) {
                    console.error("Scraping Error:", error);
                    return { title: `ไม่พบหุ้น ${name.toUpperCase()}`, headerBgColor: "#FF334B", headerFontColor: "#FFFFFF", items: [{ label: "สถานะ :", value: "ดึงข้อมูลล้มเหลว", color: "#FF334B", size: "md" }], footer: "-" };
                }
            }
        }

        // ฟังก์ชันสร้างและส่ง Flex Message
        async function sendFlexMessage() {
            const type = document.querySelector('input[name="assetType"]:checked').value;
            const stockName = document.getElementById('stockName').value;

            if (type === 'stock' && !stockName) {
                alert("กรุณาใส่ชื่อหุ้น");
                return;
            }

            const data = await fetchPriceData(type, stockName);

            // วนลูปสร้างกล่องข้อความแนวนอน เพื่อให้ Label และ Value ตรงกัน (Align)
            const bodyContents = data.items.map(item => ({
                type: "box",
                layout: "horizontal",
                margin: "md",
                contents: [
                    { 
                        type: "text", 
                        text: item.label, 
                        size: item.size === "xxl" ? "xl" : item.size, // ปรับขนาด Label ให้เล็กกว่า Value เล็กน้อย
                        color: "#666666", 
                        flex: 4, // กำหนดสัดส่วนความกว้างฝั่งซ้าย
                        gravity: "center"
                    },
                    { 
                        type: "text", 
                        text: item.value, 
                        size: item.size, 
                        weight: "bold", 
                        color: item.color, 
                        align: "end", // จัดตัวเลขชิดขวา
                        flex: 6, // กำหนดสัดส่วนความกว้างฝั่งขวา
                        adjustMode: "shrink-to-fit",
                        gravity: "center"
                    }
                ]
            }));

            // นำ footer มาต่อท้ายสุด (ถ้ามี)
            if (data.footer !== "-") {
                bodyContents.push({ 
                    type: "text", 
                    text: data.footer, 
                    size: "xs", 
                    color: "#999999", 
                    margin: "xl",
                    wrap: true
                });
            }

            // สร้างโครงสร้าง JSON โดยแบ่ง Header (Card) ออกจาก Body
            const flexJson = {
                type: "flex",
                altText: `รายงาน${data.title}`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: data.headerBgColor, // ดึงสีพื้นหลังจากที่ตั้งค่าไว้
                        paddingAll: "lg",
                        contents: [
                            { 
                                type: "text", 
                                text: data.title, 
                                weight: "bold", 
                                size: "xl", 
                                color: data.headerFontColor 
                            }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        contents: bodyContents
                    }
                }
            };

            // ส่งข้อความเข้าแชท
            try {
                if (liff.isInClient()) {
                    await liff.sendMessages([flexJson]);
                    liff.closeWindow(); 
                } else {
                    alert("ฟังก์ชันนี้ต้องเปิดผ่านแอป LINE เท่านั้น");
                }
            } catch (error) {
                console.error("Error sending message:", error);
                alert("เกิดข้อผิดพลาดในการส่งข้อความ");
            }
        }

        // เรียกใช้งานตอนโหลดหน้าเว็บ
        initializeLiff();
    </script>
</body>
</html>
