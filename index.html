<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คราคา</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        button { padding: 10px 20px; background-color: #00B900; color: white; border: none; border-radius: 5px; width: 100%; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>รายงานราคา</h2>
        
        <div class="form-group">
            <label><input type="radio" name="assetType" value="gold" checked onclick="toggleInput()"> ราคาทองคำ</label><br>
            <label><input type="radio" name="assetType" value="stock" onclick="toggleInput()"> ราคาหุ้น</label>
        </div>

        <div class="form-group" id="stockInputGroup" style="display: none;">
            <label for="stockName">ชื่อหุ้น:</label>
            <input type="text" id="stockName" list="stockList" placeholder="เช่น TISCO, SCB, BAM" style="width: 100%; padding: 8px; text-transform: uppercase;">
            <datalist id="stockList">
                <option value="TISCO"></option>
                <option value="SCB"></option>
                <option value="BAM"></option>
                <option value="NEO"></option>
                <option value="AP"></option>
            </datalist>
        </div>

        <button onclick="sendFlexMessage()">ส่งข้อความเข้าแชท</button>
    </div>

    <script>
        const LIFF_ID = "2011085564-YWiDl1zG"; 

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            } catch (err) {
                console.error("LIFF Initialization failed", err);
            }
        }

        function toggleInput() {
            const isStock = document.querySelector('input[name="assetType"]:checked').value === 'stock';
            document.getElementById('stockInputGroup').style.display = isStock ? 'block' : 'none';
        }

        async function fetchPriceData(type, name) {
            if (type === 'gold') {
                try {
                    const response = await fetch('https://api.chnwt.dev/thai-gold-api/latest');
                    const data = await response.json();
                    
                    const goldBuy = data.response.price.gold_bar.buy;
                    const goldSell = data.response.price.gold_bar.sell;
                    const apiTime = data.response.update_time.replace('เวลา', '').trim();
                    
                    const currentDate = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
                    
                    return { 
                        title: "ราคาทองคำแท่ง", 
                        headerBgColor: "#FFB000", 
                        headerFontColor: "#FFFFFF", 
                        items: [
                            { label: "ขายออก :", value: goldSell, color: "#333333", size: "xxl" },
                            { label: "รับซื้อ :", value: goldBuy, color: "#333333", size: "xxl" }
                        ],
                        footer: `อัปเดต : ${currentDate} เวลา ${apiTime}`
                    };
                } catch (error) {
                    return { title: "ราคาทองคำแท่ง", headerBgColor: "#FF334B", headerFontColor: "#FFFFFF", items: [{ label: "สถานะ :", value: "ดึงข้อมูลล้มเหลว", color: "#FF334B", size: "md" }], footer: "-" };
                }
            } else {
                // วิ่งตรงหา Yahoo API v8 โดยใช้ corsproxy.io เพื่อทะลุการบล็อกของ LINE
                try {
                    const symbol = name.toUpperCase() + '.BK';
                    const targetUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${symbol}`;
                    
                    // เปลี่ยนมาใช้ Proxy ตัวใหม่ที่เสถียรกว่าและไม่ติด Redirect
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                    
                    const response = await fetch(proxyUrl);
                    const data = await response.json();
                    
                    if (data.chart && data.chart.error) {
                        throw new Error(data.chart.error.description || "ไม่พบข้อมูลหุ้น");
                    }
                    
                    const meta = data.chart.result[0].meta;
                    const currentPrice = meta.regularMarketPrice;
                    const previousClose = meta.chartPreviousClose;
                    
                    const change = currentPrice - previousClose;
                    const percentChange = (change / previousClose) * 100;
                    
                    const sign = change > 0 ? "+" : (change < 0 ? "-" : "");
                    const changeText = sign + Math.abs(change).toFixed(2);
                    const percentText = sign + Math.abs(percentChange).toFixed(2) + "%";
                    const color = change > 0 ? "#1DB446" : (change < 0 ? "#FF334B" : "#999999");
                    
                    return { 
                        title: `ราคาหุ้น ${name.toUpperCase()}`, 
                        headerBgColor: "#1DB446", 
                        headerFontColor: "#FFFFFF", 
                        items: [
                            { label: "ราคาล่าสุด :", value: `${currentPrice.toFixed(2)} ฿`, color: "#333333", size: "xxl" },
                            { label: "เปลี่ยนแปลง :", value: changeText, color: color, size: "md" },
                            { label: "คิดเป็น :", value: percentText, color: color, size: "md" }
                        ],
                        footer: "-"
                    };
                } catch (error) {
                    alert("แจ้งเตือน Error: " + error.message);
                    return { 
                        title: `ไม่พบหุ้น ${name.toUpperCase()}`, 
                        headerBgColor: "#FF334B", 
                        headerFontColor: "#FFFFFF", 
                        items: [{ label: "สถานะ :", value: error.message || "ดึงข้อมูลล้มเหลว", color: "#FF334B", size: "xs" }], 
                        footer: "-" 
                    };
                }
            }
        }

        async function sendFlexMessage() {
            const type = document.querySelector('input[name="assetType"]:checked').value;
            const stockName = document.getElementById('stockName').value;

            if (type === 'stock' && !stockName) {
                alert("กรุณาใส่ชื่อหุ้น");
                return;
            }

            const data = await fetchPriceData(type, stockName);

            const bodyContents = data.items.map(item => ({
                type: "box",
                layout: "horizontal",
                margin: "md",
                contents: [
                    { type: "text", text: item.label, size: item.size === "xxl" ? "xl" : item.size, color: "#666666", flex: 4, gravity: "center" },
                    { type: "text", text: item.value, size: item.size, weight: "bold", color: item.color, align: "end", flex: 6, adjustMode: "shrink-to-fit", gravity: "center" }
                ]
            }));

            if (data.footer !== "-") {
                bodyContents.push({ type: "text", text: data.footer, size: "xs", color: "#999999", margin: "xl", wrap: true });
            }

            const flexJson = {
                type: "flex",
                altText: `รายงาน${data.title}`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: data.headerBgColor,
                        paddingAll: "lg",
                        contents: [
                            { type: "text", text: data.title, weight: "bold", size: "xl", color: data.headerFontColor }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        contents: bodyContents
                    }
                }
            };

            try {
                if (liff.isInClient()) {
                    await liff.sendMessages([flexJson]);
                    liff.closeWindow(); 
                } else {
                    alert("ฟังก์ชันนี้ต้องเปิดผ่านแอป LINE เท่านั้น");
                }
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการส่งข้อความ");
            }
        }

        initializeLiff();
    </script>
</body>
</html>
