<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คราคาและสุขภาพหุ้น</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        button { padding: 12px; background-color: #00B900; color: white; border: none; border-radius: 5px; width: 100%; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบเช็คหุ้น</h2>
        
        <div class="form-group">
            <label><input type="radio" name="assetType" value="health" checked onclick="toggleInput()"> 🏥 เช็คสุขภาพหุ้น (รายตัว)</label><br>
            <label><input type="radio" name="assetType" value="portfolio" onclick="toggleInput()"> 📊 เช็คหุ้นทั้งพอร์ต</label>
        </div>

        <div id="inputSection" class="form-group">
            <label id="labelName">ชื่อหุ้น:</label>
            <input type="text" id="stockInput" value="SCB,AP,BAM,NEO,SNNP" style="width: 90%; padding: 8px; text-transform: uppercase;">
        </div>

        <div class="form-group" id="payoutSection">
            <label>Payout Ratio (%):</label>
            <input type="number" id="payoutRatio" value="80" style="width: 90%; padding: 8px;">
        </div>

        <button onclick="sendFlexMessage()">ส่งข้อความเข้าแชท</button>
    </div>

    <script>
        const LIFF_ID = "2011085564-YWiDl1zG"; 

        async function initializeLiff() { await liff.init({ liffId: LIFF_ID }); }

        function toggleInput() {
            const type = document.querySelector('input[name="assetType"]:checked').value;
            document.getElementById('payoutSection').style.display = (type === 'health') ? 'block' : 'none';
        }

        async function fetchStockData(symbol, payoutPercent) {
            try {
                const tvUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://scanner.tradingview.com/thailand/scan');
                const response = await fetch(tvUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        "symbols": { "tickers": [`SET:${symbol.toUpperCase()}`] },
                        "columns": ["close", "price_earnings_ttm", "earnings_per_share_basic_ttm", "dividend_yield_recent"]
                    })
                });
                const data = await response.json();
                if (!data.data || data.data.length === 0) throw new Error(`${symbol}: ไม่พบข้อมูล`);
                
                const stats = data.data[0].d;
                const price = stats[0] || 0;
                const eps = stats[2] || 0;
                const yieldP = stats[3] || 0;
                const payoutRatio = payoutPercent / 100;
                
                const estDPS = (eps > 0) ? (eps * payoutRatio).toFixed(2) : "0.00";
                const estYield = (price > 0) ? (((eps * payoutRatio) / price) * 100).toFixed(2) : "0.00";

                return {
                    title: symbol.toUpperCase(),
                    headerBgColor: "#00B900",
                    items: [
                        { l: "ราคาปัจจุบัน", v: `${price.toFixed(2)} ฿` },
                        { l: "EPS", v: `${eps.toFixed(2)} ฿` },
                        { l: "ปันผล(อดีต)", v: `${yieldP.toFixed(2)}%` },
                        { l: "ปันผลคาดการณ์", v: `${estYield}% (${estDPS} ฿)` }
                    ]
                };
            } catch (e) { return { title: symbol.toUpperCase(), headerBgColor: "#FF334B", items: [{l: "สถานะ", v: "Error"}] }; }
        }

        async function sendFlexMessage() {
            const type = document.querySelector('input[name="assetType"]:checked').value;
            const inputVal = document.getElementById('stockInput').value;
            const payout = document.getElementById('payoutRatio').value;
            const symbols = inputVal.split(',').map(s => s.trim());

            const results = await Promise.all(symbols.map(s => fetchStockData(s, payout)));
            
            const contents = results.map(data => ({
                type: "bubble", size: "mega",
                header: { type: "box", layout: "vertical", backgroundColor: data.headerBgColor, paddingAll: "md", contents: [{ type: "text", text: data.title, color: "#FFFFFF", weight: "bold" }] },
                body: { type: "box", layout: "vertical", contents: data.items.map(i => ({ type: "box", layout: "horizontal", contents: [{ type: "text", text: i.l, size: "sm", color: "#666666" }, { type: "text", text: i.v, size: "sm", weight: "bold", align: "end" }] })) }
            }));

            await liff.sendMessages([{ type: "flex", altText: "รายงานหุ้น", contents: { type: "carousel", contents } }]);
            liff.closeWindow();
        }
        initializeLiff();
    </script>
</body>
</html>
