<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คข้อมูลหุ้นและทอง</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        button { padding: 12px; background-color: #00B900; color: white; border: none; border-radius: 5px; width: 100%; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>เมนูการใช้งาน</h2>
        <div class="form-group">
            <label><input type="radio" name="assetType" value="gold" onclick="toggleInput()"> 🥇 ราคาทองคำ</label><br>
            <label><input type="radio" name="assetType" value="stock" onclick="toggleInput()"> 📈 ราคาหุ้นรายตัว</label><br>
            <label><input type="radio" name="assetType" value="portfolio" checked onclick="toggleInput()"> 📊 เช็คหุ้นทั้งพอร์ต</label><br>
            <label><input type="radio" name="assetType" value="health" onclick="toggleInput()"> 🏥 เช็คสุขภาพหุ้น (ปันผล/งบ)</label>
        </div>

        <div id="inputSection" class="form-group">
            <label id="labelName">ชื่อหุ้น:</label>
            <input type="text" id="stockInput" value="SCB,AP,BAM,NEO,SNNP" style="width: 90%; padding: 8px; text-transform: uppercase;">
        </div>

        <div class="form-group" id="payoutSection" style="display: none;">
            <label>Payout Ratio (%):</label>
            <input type="number" id="payoutRatio" value="80" style="width: 90%; padding: 8px;">
        </div>

        <button onclick="sendFlexMessage()">ส่งข้อความเข้าแชท</button>
    </div>

    <script>
        const LIFF_ID = "2011085564-YWiDl1zG"; 
        async function initializeLiff() { await liff.init({ liffId: LIFF_ID }); }

        function toggleInput() {
            const type = document.querySelector('input[name="assetType"]:checked').value;
            document.getElementById('inputSection').style.display = (type === 'gold') ? 'none' : 'block';
            document.getElementById('payoutSection').style.display = (type === 'health') ? 'block' : 'none';
        }

        async function getGoldData() {
            const res = await fetch('https://api.chnwt.dev/thai-gold-api/latest');
            const data = await res.json();
            return {
                title: "ราคาทองคำ", headerBgColor: "#FFB000",
                items: [{ l: "ขายออก", v: data.response.price.gold_bar.sell + " ฿" }, { l: "รับซื้อ", v: data.response.price.gold_bar.buy + " ฿" }]
            };
        }

        async function getStockData(symbol, type, payout) {
            try {
                const tvUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://scanner.tradingview.com/thailand/scan');
                const res = await fetch(tvUrl, { method: 'POST', body: JSON.stringify({ "symbols": { "tickers": [`SET:${symbol.toUpperCase()}`] }, "columns": ["close", "price_earnings_ttm", "earnings_per_share_basic_ttm", "dividend_yield_recent"] }) });
                const data = await res.json();
                const stats = data.data[0].d;
                const price = stats[0] || 0, eps = stats[2] || 0, yieldP = stats[3] || 0;
                
                if (type === 'stock') {
                    return { title: symbol.toUpperCase(), headerBgColor: "#1DB446", items: [{ l: "ราคาปัจจุบัน", v: price.toFixed(2) + " ฿" }] };
                } else if (type === 'health') {
                    const estDPS = (eps * (payout/100)).toFixed(2);
                    const estYield = (price > 0) ? (((eps * (payout/100)) / price) * 100).toFixed(2) : "0.00";
                    return { title: symbol.toUpperCase(), headerBgColor: "#5E35B1", items: [{ l: "EPS", v: eps.toFixed(2) + " ฿" }, { l: "ปันผล(อดีต)", v: yieldP.toFixed(2) + "%" }, { l: "คาดการณ์", v: `${estYield}% (${estDPS} ฿)` }] };
                }
                return { title: symbol.toUpperCase(), headerBgColor: "#0288D1", items: [{ l: "ราคา", v: price.toFixed(2) + " ฿" }, { l: "ปันผล", v: yieldP.toFixed(2) + "%" }] };
            } catch(e) { return { title: symbol.toUpperCase(), headerBgColor: "#FF334B", items: [{l: "สถานะ", v: "Error"}] }; }
        }

        async function sendFlexMessage() {
            const type = document.querySelector('input[name="assetType"]:checked').value;
            let cards = [];
            if (type === 'gold') {
                cards = [await getGoldData()];
            } else {
                const symbols = document.getElementById('stockInput').value.split(',').map(s => s.trim());
                cards = await Promise.all(symbols.map(s => getStockData(s, type, document.getElementById('payoutRatio').value)));
            }

            const contents = cards.map(data => ({
                type: "bubble", size: "mega",
                header: { type: "box", layout: "vertical", backgroundColor: data.headerBgColor, paddingAll: "md", contents: [{ type: "text", text: data.title, color: "#FFFFFF", weight: "bold" }] },
                body: { type: "box", layout: "vertical", contents: data.items.map(i => ({ type: "box", layout: "horizontal", contents: [{ type: "text", text: i.l, size: "sm", color: "#666666", flex: 6 }, { type: "text", text: i.v, size: "sm", weight: "bold", align: "end", flex: 4 }] })) }
            }));

            await liff.sendMessages([{ type: "flex", altText: "รายงานข้อมูล", contents: { type: "carousel", contents } }]);
            liff.closeWindow();
        }
        initializeLiff();
    </script>
</body>
</html>
